name: release

# A tag `v{version}` releases every connector at that version, as
# `ghcr.io/nacre-work/connectors/{name}:{version}` for amd64 and arm64. The
# version is read from the manifests and must equal the tag; `lint:images`
# already holds the manifests to one another.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to release, e.g. v0.1.0 (must exist)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        connector: [git, s3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: the tag names the manifests' version
        id: version
        run: |
          set -eu
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          manifest=$(node -p "require('./connectors/${{ matrix.connector }}/package.json').version")
          [ "$version" = "$manifest" ] || { echo "::error::tag $tag but connectors/${{ matrix.connector }} is at $manifest"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: connectors/${{ matrix.connector }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nacre-work/connectors/${{ matrix.connector }}:${{ steps.version.outputs.version }}
      - name: the pushed manifest carries both architectures
        run: |
          set -eu
          archs=$(docker buildx imagetools inspect ghcr.io/nacre-work/connectors/${{ matrix.connector }}:${{ steps.version.outputs.version }} | grep -oE 'linux/(amd64|arm64)' | sort -u | tr '\n' ' ')
          echo "$archs"
          case "$archs" in *amd64*arm64*) ;; *) echo '::error::not both architectures'; exit 1;; esac
