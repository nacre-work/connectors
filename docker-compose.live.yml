# A real Nacre for the live run, from the core's **published** images at the
# version the kit's SDK is pinned to — `lint:images` does not hold that pair
# yet; `scripts/ci/live.sh` reads the tag out of this file and says which core
# it drove. Not the core's own compose file, which builds from source: a
# connector pins a release, never a branch.
#
# The four images that live on Docker Hub can be pointed elsewhere, because a
# sandbox behind Hub's anonymous pull limit answers 429 to every HEAD and the
# run would otherwise be impossible to perform by hand. The defaults are what
# CI runs; an override is a sandbox's business and changes what is measured
# only in the sense that a datastore is a datastore.
#
# The embedder is the core's constant-vector stub. Relevance decides nothing
# under it, which is exactly right here: what the live run asks is whether a
# document is **in** the index, changed, or gone — and under a constant vector
# every search returns every permitted document, so absence is provable.
name: connectors-live

x-core: &core
  image: ghcr.io/nacre-work/nacre:0.27.0
  environment: &env
    NACRE_ENV: development
    NACRE_CANONICAL_URL: http://localhost:8080
    NACRE_PG_URL: postgres://nacre:nacre@postgres:5432/nacre
    NACRE_QDRANT_URL: http://qdrant:6333
    NACRE_REDIS_URL: redis://redis:6379/0
    NACRE_PARSER_ENDPOINT: http://parser:8090
    NACRE_JWT_SECRET: live-run-only-not-a-secret-0123456789
    NACRE_JWT_ISSUER: http://localhost:8080
    NACRE_JWT_AUDIENCE: nacre
    NACRE_DEFAULT_EMBEDDING_ENDPOINT: http://stub-embedder:8000
    NACRE_DEFAULT_EMBEDDING_MODEL: stub
    NACRE_DEFAULT_EMBEDDING_DIM: "8"
    NACRE_RERANKER_ENABLED: "false"
    NACRE_MODULES: ""
    # Object storage, so a binary document has somewhere to live: the s3
    # connector sends a Word document through, and the index refuses every
    # binary upload on a deployment without a bucket. The same MinIO holds the
    # connector's *source* bucket under a different name.
    NACRE_S3_ENDPOINT: http://minio:9000
    NACRE_S3_BUCKET: nacre
    NACRE_S3_REGION: us-east-1
    NACRE_S3_ACCESS_KEY: live
    NACRE_S3_SECRET_KEY: live-run-only-not-a-secret
    NACRE_S3_FORCE_PATH_STYLE: "true"

services:
  migrate:
    <<: *core
    command: ["node", "packages/core/dist/migrate-main.js"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *core
    command: ["node", "packages/api/dist/main.js"]
    environment:
      <<: *env
      PORT: 8080
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
      stub-embedder: { condition: service_healthy }
      minio: { condition: service_started }
  worker:
    <<: *core
    command: ["node", "packages/worker/dist/main.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
      parser: { condition: service_started }
      stub-embedder: { condition: service_healthy }
  parser:
    image: ghcr.io/nacre-work/nacre-parser:0.27.0
    expose: ["8090"]
  stub-embedder:
    image: ${LIVE_NODE_IMAGE:-node:24-alpine}
    # An explicit entrypoint, so an image whose own entrypoint is `node` does
    # not run `node node …`.
    entrypoint: ["node"]
    command: ["/opt/stub/stub-embedder.mjs"]
    environment: { PORT: "8000", NACRE_DEFAULT_EMBEDDING_DIM: "8" }
    volumes: ["./scripts/ci:/opt/stub:ro"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 10
  source-drive:
    # The drive connector's source: `scripts/ci/drive-stub.mjs` serving the
    # directory `live.sh` writes as a Drive. There is no Google in CI, so this
    # is what the connector's image is driven against — the API's shape, and
    # nothing of Google. The directory is bind-mounted and read on every
    # request, so the run's edits need no restart.
    image: ${LIVE_NODE_IMAGE:-node:24-alpine}
    entrypoint: ["node"]
    command: ["/opt/stub/drive-stub.mjs"]
    environment: { PORT: "9500", DRIVE_ROOT: /drive }
    volumes: ["./scripts/ci:/opt/stub:ro", "./scripts/ci/.live-drive:/drive:ro"]
    ports: ["9500:9500"]
  minio:
    # Chainguard's build, as the core's own CI: `minio/minio` left Docker Hub.
    image: ${LIVE_MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment: { MINIO_ROOT_USER: live, MINIO_ROOT_PASSWORD: live-run-only-not-a-secret }
    ports: ["9000:9000"]
  # The mongo connector's source — a collection `live.sh` seeds and edits
  # through mongosh. Published on the host for `LIVE_FROM_DIST=1`, no
  # authentication because it holds two documents written by this script, and
  # started with the rest so the one compose file stays one; a run for another
  # connector never names it.
  source-mongo:
    image: ${LIVE_MONGO_IMAGE:-mongo:7}
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10
  # The imap connector's source: a GreenMail with authentication off, so any
  # credential signs in and a delivery creates the account it is addressed
  # to. SMTP on 3025 is how the run writes a message, IMAP on 3143 is how the
  # connector and the run's `delete` read the folder; the image's SMTP and
  # IMAP are the only two of its servers the run touches.
  source-imap:
    image: ${LIVE_GREENMAIL_IMAGE:-greenmail/standalone:2.1.3}
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    ports: ["3025:3025", "3143:3143"]
  postgres:
    image: ${LIVE_POSTGRES_IMAGE:-postgres:17-alpine}
    environment: { POSTGRES_USER: nacre, POSTGRES_PASSWORD: nacre, POSTGRES_DB: nacre }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nacre -d nacre"]
      interval: 5s
      timeout: 5s
      retries: 10
  # The sql connector's source: a second Postgres, never the index's own — a
  # connector pointed at the database behind the index reads what it writes.
  # Published on 5433 so `LIVE_FROM_DIST=1` reaches it from the host without
  # taking the port a Postgres of the host's own would hold.
  source-postgres:
    image: ${LIVE_POSTGRES_IMAGE:-postgres:17-alpine}
    environment: { POSTGRES_USER: source, POSTGRES_PASSWORD: source, POSTGRES_DB: source }
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source -d source"]
      interval: 5s
      timeout: 5s
      retries: 10
  qdrant:
    image: ${LIVE_QDRANT_IMAGE:-qdrant/qdrant:v1.18.3}
    expose: ["6333"]
  redis:
    image: ${LIVE_REDIS_IMAGE:-redis:7-alpine}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
